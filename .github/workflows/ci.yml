name: tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flask pytest
      # Playwright UI test skips itself when playwright/Chromium is absent; it is run locally (see docs/evidence).
      - run: python -m pytest -q
      - run: python -m recon --db work/ci.db demo
      - run: python tests/evaluation/benchmark.py --rows 1000
